[platformio]
default_envs = cyd, freenove_s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
board_build.partitions = min_spiffs.csv
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    mathieucarbou/ESP Async WebServer
    mathieucarbou/AsyncTCP
    bblanchon/ArduinoJson

[env:cyd]
board = esp32dev
monitor_port = /dev/cu.usbserial-110
upload_port = /dev/cu.usbserial-110
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_CYD

[env:ccyd]
board = esp32dev
monitor_port = /dev/cu.usbserial-10
upload_port = /dev/cu.usbserial-10
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_CCYD

[env:freenove_s3]
board = esp32-s3-devkitc-1
monitor_port = /dev/cu.usbmodem201101
upload_port = /dev/cu.usbmodem201101
build_flags =
    ${env.build_flags}
    -DBOARD_FREENOVE_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
