[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-110
upload_port = /dev/cu.usbserial-110
upload_speed = 460800
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DBOARD_CYD
board_build.partitions = min_spiffs.csv
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    mathieucarbou/ESP Async WebServer
    mathieucarbou/AsyncTCP
    bblanchon/ArduinoJson

[env:freenove_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem201101
upload_port = /dev/cu.usbmodem201101
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DBOARD_FREENOVE_S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = min_spiffs.csv
lib_deps =
    lovyan03/LovyanGFX
    tzapu/WiFiManager
    mathieucarbou/ESP Async WebServer
    mathieucarbou/AsyncTCP
    bblanchon/ArduinoJson
